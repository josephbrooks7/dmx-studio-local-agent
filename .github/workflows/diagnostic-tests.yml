name: Diagnostic client tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
